<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mi Hotel</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .login-box {
            background: linear-gradient(to bottom, #FFFFFF, #FFFBF8);
            border: 2px solid #FFE5D9;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 15px 50px rgba(var(--color-primary-rgb), 0.4),
                        0 5px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
            animation: slideDown 0.5s ease-out;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: var(--color-primary);
            font-size: 2.2em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(var(--color-primary-rgb), 0.2);
        }

        .login-header p {
            color: var(--color-heading);
            font-size: 1em;
            margin: 0;
        }

        .login-hint-clave {
            margin-top: 8px !important;
            font-size: 0.85em !important;
            color: #777 !important;
        }

        .login-logo-wrap {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 72px;
        }

        .login-icon {
            font-size: 4em;
            margin: 0;
        }

        .login-logo-img {
            max-width: 120px;
            max-height: 96px;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .login-form {
            margin-top: 30px;
        }

        .form-group-login {
            margin-bottom: 25px;
        }

        .form-group-login label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-heading);
            font-weight: 600;
            font-size: 0.95em;
        }

        .form-group-login input {
            width: 100%;
            padding: 14px;
            border: 2px solid #FFE5D9;
            border-radius: 12px;
            font-size: 1em;
            transition: all 0.3s;
            background: white;
            box-sizing: border-box;
        }

        .form-group-login input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(var(--color-primary-rgb), 0.1);
            transform: translateY(-2px);
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-mid) 50%, var(--color-primary-light) 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(var(--color-primary-rgb), 0.4);
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 30px rgba(var(--color-primary-rgb), 0.5);
            background: linear-gradient(135deg, var(--color-primary-mid) 0%, var(--color-primary-light) 50%, #ffc066 100%);
        }

        .btn-login:active {
            transform: translateY(-1px) scale(1);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: linear-gradient(135deg, #FFCDD2 0%, #FFB3BA 100%);
            color: #C62828;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #EF9A9A;
            font-size: 0.9em;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 12px;
                align-items: flex-start;
                padding-top: 24px;
            }

            .login-box {
                padding: 28px 18px;
                border-radius: 14px;
                max-width: none;
            }

            .login-header h1 {
                font-size: 1.65em;
                word-break: break-word;
            }

            .login-icon {
                font-size: 3em;
            }

            .form-group-login input {
                font-size: 16px;
                min-height: 48px;
            }

            .btn-login {
                min-height: 48px;
                font-size: 1.05em;
            }
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 22px 14px;
            }

            .login-header h1 {
                font-size: 1.4em;
            }
        }

        .servidor-espera-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(4px);
        }

        .servidor-espera-overlay[hidden] {
            display: none !important;
        }

        .servidor-espera-card {
            max-width: 420px;
            width: 100%;
            background: #fff;
            border-radius: 16px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .servidor-espera-spinner {
            width: 42px;
            height: 42px;
            margin: 0 auto 16px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--color-primary, #2563eb);
            border-radius: 50%;
            animation: servidorEsperaSpin 0.9s linear infinite;
        }

        @keyframes servidorEsperaSpin {
            to { transform: rotate(360deg); }
        }

        .servidor-espera-titulo {
            margin: 0 0 8px;
            font-size: 1.15rem;
            color: #0f172a;
        }

        .servidor-espera-texto {
            margin: 0 0 16px;
            font-size: 0.92rem;
            color: #64748b;
            line-height: 1.45;
        }

        .servidor-espera-intento {
            margin: 0;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .btn-reintentar-servidor {
            margin-top: 14px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: var(--color-primary, #2563eb);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="servidorEsperaOverlay" class="servidor-espera-overlay" hidden>
        <div class="servidor-espera-card">
            <div class="servidor-espera-spinner" id="servidorEsperaSpinner"></div>
            <h2 class="servidor-espera-titulo" id="servidorEsperaTitulo">Iniciando aplicación…</h2>
            <p class="servidor-espera-texto" id="servidorEsperaTexto">
                El servidor en internet puede tardar hasta 1–2 minutos en despertar (plan gratuito de Render).
                Por favor espere…
            </p>
            <p class="servidor-espera-intento" id="servidorEsperaIntento"></p>
            <button type="button" class="btn-reintentar-servidor" id="btnReintentarServidor" hidden onclick="location.reload()">
                Reintentar
            </button>
        </div>
    </div>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-logo-wrap">
                    <img id="loginHotelLogo" class="login-logo-img" alt="" hidden>
                    <div class="login-icon" id="loginHotelIconDefault">🏨</div>
                </div>
                <h1 id="loginHotelNombre">Mi Hotel</h1>
                <p class="login-subtitulo">Inicie sesión para continuar</p>
                <p class="login-hint-clave">La contraseña no distingue mayúsculas ni minúsculas (administrador y operador).</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <form class="login-form" id="loginForm">
                <div class="form-group-login">
                    <label for="username">Usuario</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required 
                        autocomplete="username"
                        placeholder="Ingrese su usuario"
                        autofocus
                    >
                </div>

                <div class="form-group-login">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                        autocapitalize="off"
                        autocorrect="off"
                        spellcheck="false"
                        placeholder="Ingrese su contraseña"
                    >
                </div>

                <button type="submit" class="btn-login" id="loginButton">
                    Iniciar Sesión
                </button>
            </form>
        </div>
    </div>

    <script src="theme-apply.js?v=7"></script>
    <script>
        const API_URL = `${window.location.origin}/api`;
        const ES_PRODUCCION_WEB =
            !/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(window.location.origin);

        function mostrarOverlayServidor(mostrar) {
            const overlay = document.getElementById('servidorEsperaOverlay');
            if (overlay) overlay.hidden = !mostrar;
        }

        function actualizarOverlayServidor({ titulo, texto, intento, mostrarReintentar, mostrarSpinner }) {
            const tituloEl = document.getElementById('servidorEsperaTitulo');
            const textoEl = document.getElementById('servidorEsperaTexto');
            const intentoEl = document.getElementById('servidorEsperaIntento');
            const btn = document.getElementById('btnReintentarServidor');
            const spinner = document.getElementById('servidorEsperaSpinner');
            if (tituloEl && titulo) tituloEl.textContent = titulo;
            if (textoEl && texto) textoEl.textContent = texto;
            if (intentoEl) intentoEl.textContent = intento || '';
            if (btn) btn.hidden = !mostrarReintentar;
            if (spinner) spinner.hidden = mostrarSpinner === false;
        }

        function esperar(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        async function esperarServidorListo() {
            const maxIntentos = ES_PRODUCCION_WEB ? 40 : 8;
            const pausaMs = ES_PRODUCCION_WEB ? 3000 : 1500;

            mostrarOverlayServidor(true);
            actualizarOverlayServidor({
                titulo: 'Iniciando aplicación…',
                texto: ES_PRODUCCION_WEB
                    ? 'El servidor en internet puede tardar hasta 1–2 minutos en despertar (plan gratuito de Render). Por favor espere…'
                    : 'Conectando con el servidor local…',
                intento: '',
                mostrarReintentar: false,
                mostrarSpinner: true
            });

            for (let i = 1; i <= maxIntentos; i++) {
                try {
                    const ctrl = new AbortController();
                    const timer = setTimeout(() => ctrl.abort(), 25000);
                    const response = await fetch(`${API_URL}/status`, {
                        cache: 'no-store',
                        signal: ctrl.signal
                    });
                    clearTimeout(timer);
                    if (response.ok) {
                        const data = await response.json();
                        if (data && data.ok) {
                            mostrarOverlayServidor(false);
                            return true;
                        }
                    }
                } catch (_) {
                    /* reintento */
                }

                actualizarOverlayServidor({
                    intento: `Intento ${i} de ${maxIntentos}…`,
                    mostrarReintentar: false,
                    mostrarSpinner: true
                });
                if (i < maxIntentos) await esperar(pausaMs);
            }

            actualizarOverlayServidor({
                titulo: 'No se pudo conectar',
                texto: ES_PRODUCCION_WEB
                    ? 'El servidor aún no responde. En el plan gratuito de Render puede tardar más. Espere un momento y pulse Reintentar, o vuelva en 1–2 minutos.'
                    : 'No se pudo conectar al servidor. Ejecute npm start en la carpeta del proyecto y vuelva a intentar.',
                intento: '',
                mostrarReintentar: true,
                mostrarSpinner: false
            });
            return false;
        }

        async function obtenerNombreHotelPublico() {
            try {
                const r = await fetch(`${API_URL}/hotel/nombre`, { cache: 'no-store' });
                if (r.ok) {
                    const d = await r.json();
                    const n = d && d.nombre != null ? String(d.nombre).trim() : '';
                    if (n) return n;
                }
            } catch (e) {
                console.warn('No se pudo cargar /hotel/nombre:', e);
            }
            return null;
        }

        async function aplicarTemaDesdeServidor() {
            let data = {};
            try {
                const response = await fetch(`${API_URL}/hotel/apariencia`, { cache: 'no-store' });
                if (response.ok) {
                    data = await response.json();
                }
            } catch (error) {
                console.error('Error al cargar apariencia:', error);
            }
            if (!data.nombre || !String(data.nombre).trim()) {
                const nombreBd = await obtenerNombreHotelPublico();
                if (nombreBd) {
                    data.nombre = nombreBd;
                }
            }
            if (typeof TemaHotel !== 'undefined') {
                TemaHotel.aplicarMarcaHotel(document, data);
            } else {
                const nombre = (data && data.nombre) ? String(data.nombre).trim() : 'Mi Hotel';
                const h1 = document.getElementById('loginHotelNombre');
                if (h1) h1.textContent = nombre;
                document.title = nombre;
            }
        }

        // Verificar si ya está autenticado
        async function checkAuth() {
            try {
                const response = await fetch(`${API_URL}/auth/check`, {
                    credentials: 'include'
                });
                const data = await response.json();
                if (data.authenticated) {
                    window.location.href = '/index.html';
                }
            } catch (error) {
                console.error('Error al verificar autenticación:', error);
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginButton = document.getElementById('loginButton');
            const errorMessage = document.getElementById('errorMessage');
            
            // Ocultar mensaje de error
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';
            
            // Deshabilitar botón y mostrar loading
            loginButton.disabled = true;
            loginButton.innerHTML = '<span class="loading"></span>Iniciando sesión...';
            
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });

                let data = {};
                const raw = await response.text();
                if (raw) {
                    try {
                        data = JSON.parse(raw);
                    } catch (_) {
                        data = { error: raw.slice(0, 200) };
                    }
                }

                if (response.ok) {
                    window.location.replace('/index.html');
                    return;
                }

                errorMessage.textContent = data.error || 'Error al iniciar sesión';
                if (response.status === 401) {
                    errorMessage.textContent = 'Usuario o contraseña incorrectos.';
                }
                if (response.status === 403) {
                    errorMessage.textContent +=
                        ' Si acaba de crear la cuenta, pida al administrador que verifique que no esté anulada en Configuración.';
                }
                errorMessage.classList.add('show');
                loginButton.disabled = false;
                loginButton.textContent = 'Iniciar Sesión';
            } catch (error) {
                errorMessage.textContent = ES_PRODUCCION_WEB
                    ? 'Error de conexión con el servidor en internet. Espere 1–2 minutos (plan gratuito) y vuelva a intentar.'
                    : 'Error de conexión. Abra http://localhost:3000 y verifique que el servidor esté corriendo (npm start).';
                errorMessage.classList.add('show');
                loginButton.disabled = false;
                loginButton.textContent = 'Iniciar Sesión';
            }
        }

        // Cargar colores públicos primero y luego comprobar sesión
        (async function inicializarPaginaLogin() {
            const servidorOk = await esperarServidorListo();
            if (!servidorOk) return;

            if (typeof TemaHotel !== 'undefined') {
                TemaHotel.aplicarNombreDesdeStorage(document);
            } else {
                try {
                    const n = localStorage.getItem('hotelNombreMarca');
                    if (n) {
                        const h1 = document.getElementById('loginHotelNombre');
                        if (h1) h1.textContent = n;
                        document.title = n;
                    }
                } catch (_) { /* ignore */ }
            }
            await aplicarTemaDesdeServidor();
            const aviso = sessionStorage.getItem('loginAviso');
            if (aviso) {
                sessionStorage.removeItem('loginAviso');
                const errorMessage = document.getElementById('errorMessage');
                errorMessage.textContent =
                    aviso === 'Cuenta desactivada' || aviso === 'Cuenta anulada'
                        ? 'Su sesión terminó porque la cuenta fue anulada. Contacte a un administrador para reactivarla.'
                        : aviso;
                errorMessage.classList.add('show');
            }
            checkAuth();
        })();

        // Enter en contraseña: enviar formulario correctamente
        document.getElementById('loginForm').addEventListener('submit', handleLogin);
        document.getElementById('loginForm').removeAttribute('onsubmit');
    </script>
</body>
</html>
