# Despliegue en Render: https://render.com
# La BD SQLite se crea sola en ./data/hotel.db al arrancar.
# Para datos permanentes entre reinicios, añade disco y DATA_DIR=/data (plan de pago).
services:
  - type: web
    name: hostal-analauli
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Solo copia seed/hotel.db si aún no existe data/hotel.db (no borra datos en cada deploy).
      - key: APPLY_DB_SEED
        value: "0"
      # Descomenta si añades disco persistente montado en /data:
      # - key: DATA_DIR
      #   value: /data
